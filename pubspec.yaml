name: flutter_osrm_navigation
description: Turn-by-turn navigation for flutter_map on any OSRM or Valhalla server. Off-route rerouting, voice prompts, a banner and map layers you can recolor.
version: 0.1.4
homepage: https://github.com/orestislef/flutter_osrm_navigation
repository: https://github.com/orestislef/flutter_osrm_navigation
issue_tracker: https://github.com/orestislef/flutter_osrm_navigation/issues
topics:
  - navigation
  - osrm
  - valhalla
  - flutter-map
  - routing

screenshots:
  - description: Navigating with the banner, the route and the position.
    path: screenshots/navigation.webp
  - description: The maneuver right after the next one, shown with it.
    path: screenshots/then.webp
  - description: Custom colors through NavigationStyle, in Greek.
    path: screenshots/custom_colors_greek.webp
  - description: Night theme.
    path: screenshots/night.webp
  - description: Arrived at the destination.
    path: screenshots/arrived.webp

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.0
  flutter_tts: ^4.2.5
  geolocator: ^14.0.0
  http: ^1.2.0
  latlong2: ">=0.9.1 <0.11.0"

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
